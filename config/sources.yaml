# Job Hunter source registry (job-hunter.md §5.2-5.3, D-JH-01/02).
# A source is enabled only after JH-TV-02 documents a permitted access mechanism (ToS/robots,
# docs/SOURCE_VERIFICATION.md) AND the user approves it (Master §3.4). 2026-11-16: group A on. A cycle with disabled sources
# is "reduced coverage", not an error.
#
# KB version note: the specs cite KB v2.0 (2026-11-12, "R2"), which is not present in
# either source folder. This registry follows job-hunter.md §5.3 (approved) and the
# available KB v1.0 (private/knowledge/kb/job_hunter_intelligence_tasmania_2026-11-07.md).
config_version: "1.2.0"   # 1.2.0: sweep fields job_link / pages / title_filter / employer / default_location (RT-14b)
kb_version: "1.0 (2026-11-07); v2.0 referenced by specs but missing"

access_modes: [page_read, search_discovery, official_feed, email_alert, disabled]

sources:
