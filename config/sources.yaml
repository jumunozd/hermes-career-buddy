zones:                         # job-hunter.md §3.6 (approved D-JH-02, D-JH-09)
  in_scope:
    sur: [Hobart, Glenorchy, Clarence, Kingborough, Brighton, Derwent Park, Lutana, Cambridge, Prince of Wales Bay]
    sur_periferia: [New Norfolk, Boyer]
    norte: [Launceston]
    norte_periferia: [George Town, Bell Bay]
    noroeste: [Burnie, Devonport, Heybridge, Penguin, Ulverstone, Parramatta Creek, Spreyton]
    noroeste_periferia: [Wynyard, Latrobe]
  out_of_scope_examples: [Rosebery, Queenstown, Strahan, Savage River, Scottsdale, St Helens, Dover, Huonville, Port Huon]  # Port Huon: Huon Valley, as decided in RT-13

global_exclusions:             # job-hunter.md §3.5
  - process worker
  - event planner
  - wedding
  - software developer
  - "mining engineer (unless reviewed)"
  - "business analyst, purely software"
  - "sales/account role with dominant commission"
  - "field engineer, telco/IT"
  - "residential construction project engineer requiring builder registration"
